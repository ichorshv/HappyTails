name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # contextLoads needs a real database
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: happytails
          POSTGRES_USER: happytails
          POSTGRES_PASSWORD: happytails-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U happytails -d happytails"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_DB: happytails
      POSTGRES_USER: happytails
      POSTGRES_PASSWORD: happytails-ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Check format, build and test
        run: ./mvnw -B spotless:check verify

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
