spring.application.name=backend

spring.datasource.url=jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:happytails}
spring.datasource.username=${POSTGRES_USER:happytails}
spring.datasource.password=${POSTGRES_PASSWORD:change-me}

# Login session (ADR-0003): ends after 30 minutes without activity.
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax


# Email (issue #42). No profile = only logs, "dev" = Mailpit, "brevo" = real emails.
app.notification.sender-name=HappyTails
app.notification.sender-email=${MAIL_SENDER_EMAIL:no-reply@example.com}
app.notification.brevo-api-key=${BREVO_API_KEY:}
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
