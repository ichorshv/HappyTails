spring.application.name=backend

spring.datasource.url=jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:happytails}
spring.datasource.username=${POSTGRES_USER:happytails}
spring.datasource.password=${POSTGRES_PASSWORD:change-me}

# Login session (ADR-0003): ends after 30 minutes without activity.
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax


# Geocoding (Nominatim). "fake" never calls the internet; use GEOCODING_PROVIDER=nominatim for real.
geocoding.provider=${GEOCODING_PROVIDER:fake}
geocoding.base-url=${GEOCODING_BASE_URL:https://nominatim.openstreetmap.org}
geocoding.user-agent=${GEOCODING_USER_AGENT:HappyTails/1.0 (student project)}
geocoding.min-interval=1s
geocoding.timeout=5s
